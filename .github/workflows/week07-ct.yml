name: Week 7 CT

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why is this retraining being started?
        required: true
        type: string
  schedule:
    - cron: "0 21 * * 1"

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Why this run happened
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_REASON: ${{ inputs.reason }}
        run: |
          echo "Trigger: $GITHUB_EVENT_NAME"
          if [ -n "$RUN_REASON" ]; then
            echo "Reason: $RUN_REASON"
          else
            echo "Reason: scheduled weekly retraining"
          fi
      - name: Rebuild the dataset
        run: make data-v2
      - name: retrain and gate
        run: make ct-local
      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error::CT failed; inspect the gate verdict and uploaded evidence."
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week-7-ct-evidence
          path: |
            labs/week-07-ci-workflow/starter/metrics/
            labs/week-07-ci-workflow/starter/reports/
            labs/week-07-ci-workflow/starter/models/model.pkl
          if-no-files-found: warn
